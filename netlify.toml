[build]
  publish = "."
  # No build command needed for pure static site

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Pretty URLs are canonical. Force .html → extensionless so GSC does not index twins.
[[redirects]]
  from = "/homes"
  to = "/search"
  status = 301
  force = true

[[redirects]]
  from = "/search.html"
  to = "/search"
  status = 301
  force = true

